robot:
  connection_type: "ap"

data_collection:
  data_dir: "data/raw/run1"
  files:
    position: "position_data"
    attitude: "attitude_data"
    imu: "idle_imu_data.csv"
    esc: "esc_data.csv"
    distance: "idle_tof_data"
    gimbal: "gimbal_data"
    exploration: "exploration_grid_data"
  frequencies:
    position: 1
    attitude: 5
    imu: 10
    esc: 20
    distance: 5
    camera: 5 #second
    gimbal: 1
  buffer_time: 0.5   # Wait time before closing (seconds)

movement:
  xy_speed: 1      # Forward/Reverse Speed ​​(m/s)
  distance: 0.6      # Forward/backward travel distance (m)
  z_speed: 30        # Rotation speed (degrees/second)
  angle: 90          # Initial turning angle (e.g., 90 degrees)

gimbal:
  bullet_type: "WATER_FIRE"
  target_marker: "1"
  error_threshold: 0.03       # ระยะคลาดเคลื่อนที่ยอมรับได้ (Deadband)
  pid_yaw:
    kp: 120.0                 # ปรับค่าตามความเหมาะสม
    ki: 0.0
    kd: 5.0
    limit: 180
  pid_pitch:
    kp: 100.0
    ki: 0.0
    kd: 5.0
    limit: 120

grid_map:
  max_x: 4              # จำนวนช่องแกน X
  max_y: 5              # จำนวนช่องแกน Y
  cell_size: 0.6         # ขนาดช่อง (m) — 60cm
  start_x: 0             # ตำแหน่งเริ่มต้น grid X (0-based)
  start_y: 0             # ตำแหน่งเริ่มต้น grid Y (0-based)
  start_heading: 0       # ทิศเริ่มต้น 0=North, 1=East, 2=South, 3=West

exploration:
  wall_threshold_mm: 400  # ระยะ ToF < นี้ = มีกำแพง (mm)
  scan_settle_time: 0.5   # รอ gimbal หยุดนิ่งก่อนอ่าน ToF (s)
  tof_samples: 3          # จำนวนค่า ToF ที่อ่านแล้วเฉลี่ย
  tof_read_interval: 0.1  # ช่วงเวลาระหว่างการอ่าน ToF แต่ละครั้ง (s)
  move_speed: 0.5         # ความเร็วเดินหน้า (m/s)
  turn_speed: 60          # ความเร็วหมุนตัว (deg/s)
