robot:
  connection_type: "ap"

data_collection:
  data_dir: "data/raw/run1"
  files:
    position: "position_data"
    attitude: "attitude_data"
    imu: "idle_imu_data.csv"
    esc: "esc_data.csv"
    distance: "idle_tof_data"
    gimbal: "gimbal_data"
  frequencies:
    position: 1
    attitude: 5
    imu: 10
    esc: 20
    distance: 5
    camera: 5 #second
    gimbal: 1
  buffer_time: 0.5   # Wait time before closing (seconds)

movement:
  xy_speed: 1      # Forward/Reverse Speed ​​(m/s)
  distance: 0.6      # Forward/backward travel distance (m)
  z_speed: 30        # Rotation speed (degrees/second)
  angle: 90          # Initial turning angle (e.g., 90 degrees)

targeting:
  required_color: "blue"
  required_shape: "circle"
  min_targets: 16
  max_targets: 65
  spacing_min_m: 0.03
  spacing_max_m: 0.07
  # Measure this once for the camera/target distance and update as needed.
  pixels_per_meter: 1000
  y_direction: 1

gimbal:
  bullet_type: "WATER_FIRE"
  target_marker: "1"
  shots_per_target: 1
  error_threshold: 0.08       # ระยะคลาดเคลื่อนที่ยอมรับได้ (Deadband)
  fire_error_threshold: 0.03  # ต้องตรงเป้ามากก่อนอนุญาตให้ยิง
  pid_yaw:
    kp: 120.0                 # ปรับค่าตามความเหมาะสม
    ki: 0.0
    kd: 5.0
    limit: 180
  pid_pitch:
    kp: 100.0
    ki: 0.0
    kd: 5.0
    limit: 120

